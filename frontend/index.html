<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Learning Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SQL Learning Platform</h1>
    </header>

    <main class="container">
        <section id="exercise-section">
            <h2>Exercise</h2>
            <div id="exercise-description">
                <p>Welcome! Select an exercise to begin. The description of the exercise will appear here.</p>
            </div>
        </section>

        <section id="editor-section">
            <h2>SQL Editor</h2>
            <textarea id="sql-query-input" rows="10" placeholder="Enter your SQL query here..."></textarea>
            <button id="submit-query-button">Submit Query</button>
        </section>

        <section id="results-section">
            <h2>Results</h2>
            <div id="query-results">
                <p>Your query results or error messages will appear here.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
